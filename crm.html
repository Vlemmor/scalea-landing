<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="solo_logo.png?v=2" />
    <title>CRM de Clientes | Scalea Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #0b0b0f;
            background-image: 
                radial-gradient(at 0% 0%, rgba(20, 20, 30, 0.5) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(10, 10, 15, 0.5) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(20, 20, 25, 0.4) 0px, transparent 50%);
            color: #ffffff;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding: 2rem 1.5rem;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 1.5rem;
        }

        .back-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Glassmorphism card adaptation */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        /* Search and Filter section */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-input {
            flex: 1;
            padding: 0.85rem 1.25rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Client Grid/List */
        .clients-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .client-row-card {
            background: rgba(255, 255, 255, 0.015);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 1.75rem;
            transition: all 0.2s;
        }

        .client-row-card:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .client-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .client-info h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #ffffff;
        }

        .client-badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            color: #c7c7cc;
            font-weight: 500;
            text-transform: uppercase;
        }

        .client-meta {
            display: flex;
            gap: 1.5rem;
            margin-top: 0.8rem;
            color: #8e8e93;
            font-size: 0.85rem;
            flex-wrap: wrap;
        }

        .client-meta span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .client-actions {
            display: flex;
            gap: 0.8rem;
        }

        .btn-crm-action {
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .btn-crm-primary {
            background: #ffffff;
            color: #0b0b0f;
            border: none;
        }

        .btn-crm-primary:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        .btn-crm-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .btn-crm-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Proposals dropdown panel */
        .proposals-history-panel {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
        }

        .proposal-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .proposal-item:last-child {
            margin-bottom: 0;
        }

        .prop-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .prop-date {
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
        }

        .prop-services {
            font-size: 0.8rem;
            color: #8e8e93;
        }

        .prop-amount {
            font-size: 0.95rem;
            font-weight: 800;
            color: #4caf50;
        }

        .prop-actions {
            display: flex;
            gap: 0.5rem;
        }

        .no-clients {
            text-align: center;
            padding: 3rem;
            color: #8e8e93;
        }

        .no-clients span {
            font-size: 3rem;
            display: block;
            margin-bottom: 1rem;
        }
    </style>
    <script>
        // Security check before loading page contents
        if (sessionStorage.getItem('scalea_auth') !== 'true') {
            const loc = window.location;
            const base = loc.pathname.substring(0, loc.pathname.lastIndexOf('/'));
            window.location.href = loc.origin + base + '/paneladmin';
        }

        const getDefaultApiUrl = () => {
            if (window.location.hostname.includes('github.io')) {
                return 'https://scalea-landing-production.up.railway.app';
            }
            return window.location.origin;
        };

        // Retrieve API Base URL dynamically
        const getApiUrl = () => {
            return localStorage.getItem('scalea_api_url') || getDefaultApiUrl();
        };
    </script>
</head>
<body>
    <div class="portal-container" style="max-width: 1000px; margin: 0 auto;">
        <!-- Header -->
        <header class="nav-header">
            <div>
                <h1 style="font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px;">
                    CRM de <span class="gradient-text" style="background: linear-gradient(135deg, #ffffff 0%, #a1a1a1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Clientes</span>
                </h1>
                <p class="subtitle" style="margin-top: 0.2rem;">Consulta de propuestas y reactivación comercial de clientes</p>
            </div>
            <a href="paneladmin" class="back-btn">← Volver al Panel</a>
        </header>

        <!-- Search Bar -->
        <div class="glass-card" style="padding: 1.5rem;">
            <div class="filter-bar">
                <input type="text" id="search-box" class="search-input" placeholder="🔍 Buscar por negocio, CIF o email de cliente..." oninput="filterClients()">
            </div>
        </div>

        <!-- Clients Container -->
        <div class="glass-card" style="min-height: 400px;">
            <div id="clients-container" class="clients-list">
                <!-- Dynamic clients load here -->
                <div class="no-clients">
                    <span>⏳</span>
                    Cargando base de datos de clientes...
                </div>
            </div>
        </div>
    </div>

    <script>
        let allClients = [];

        async function fetchBudgetData() {
            let budgets = [];
            const apiUrl = getApiUrl();
            const loc = window.location;
            const cleanApiUrl = (apiUrl === loc.origin) ? '' : apiUrl;

            // 1. Fetch Cloud Budgets
            try {
                if (cleanApiUrl) {
                    const response = await fetch(`${cleanApiUrl}/api/budgets`);
                    if (response.ok) {
                        budgets = await response.json();
                    }
                }
            } catch (err) {
                console.warn("Could not load cloud budgets. Checking local backup.", err);
            }

            // 2. Fetch Local Storage Budgets
            let localBudgets = [];
            try {
                localBudgets = JSON.parse(localStorage.getItem('scalea_local_budgets') || '[]');
            } catch (e) {
                console.error(e);
            }

            // Combine both sources
            budgets = [...budgets, ...localBudgets];

            // Sort all budgets by date descending
            budgets.sort((a, b) => new Date(b.timestamp || b.createdAt) - new Date(a.timestamp || a.createdAt));

            // Group proposals by client (keyed by name/CIF)
            const clientsMap = {};
            budgets.forEach(b => {
                const key = (b.clientCif || b.businessName || 'Desconocido').trim().toLowerCase();
                
                if (!clientsMap[key]) {
                    clientsMap[key] = {
                        name: b.businessName || 'Cliente sin nombre',
                        cif: b.clientCif || '',
                        email: b.clientEmail || '',
                        address: b.clientAddress || '',
                        proposals: []
                    };
                }
                
                // Calculate proposal total
                let totalAmount = 0;
                if (b.services) {
                    b.services.forEach(s => totalAmount += (s.price || 0));
                }

                // Generate view link
                let proposalLink = '';
                if (b.id) {
                    // Cloud URL
                    proposalLink = `proposal.html?id=${b.id}&api=${encodeURIComponent(cleanApiUrl || loc.origin)}`;
                } else {
                    // Portable URL
                    const dataStr = btoa(unescape(encodeURIComponent(JSON.stringify(b))));
                    proposalLink = `proposal.html?data=${dataStr}`;
                }

                clientsMap[key].proposals.push({
                    id: b.id || '',
                    timestamp: b.timestamp || b.createdAt,
                    total: totalAmount,
                    servicesCount: b.services ? b.services.length : 0,
                    servicesList: b.services ? b.services.map(s => s.name).join(', ') : '',
                    link: proposalLink
                });
            });

            allClients = Object.values(clientsMap);
            renderClients(allClients);
        }

        function renderClients(clients) {
            const container = document.getElementById('clients-container');
            container.innerHTML = "";

            if (clients.length === 0) {
                container.innerHTML = `
                    <div class="no-clients">
                        <span>👥</span>
                        No se encontraron clientes registrados.
                    </div>
                `;
                return;
            }

            clients.forEach((client, idx) => {
                const card = document.createElement('div');
                card.className = 'client-row-card';
                
                const queryParams = new URLSearchParams({
                    businessName: client.name,
                    clientCif: client.cif,
                    clientEmail: client.email,
                    clientAddress: client.address
                }).toString();

                card.innerHTML = `
                    <div class="client-header">
                        <div class="client-info">
                            <div style="display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;">
                                <h3>${client.name}</h3>
                                ${client.cif ? `<span class="client-badge">${client.cif}</span>` : ''}
                            </div>
                            <div class="client-meta">
                                ${client.email ? `<span>✉️ ${client.email}</span>` : ''}
                                ${client.address ? `<span>📍 ${client.address}</span>` : ''}
                                <span>📄 ${client.proposals.length} ${client.proposals.length === 1 ? 'propuesta' : 'propuestas'}</span>
                            </div>
                        </div>
                        <div class="client-actions">
                            <a href="admin.html?${queryParams}" class="btn-crm-action btn-crm-primary">
                                ➕ Nueva Propuesta
                            </a>
                            <button onclick="toggleHistory(${idx})" class="btn-crm-action btn-crm-secondary">
                                👁️ Ver Historial
                            </button>
                        </div>
                    </div>

                    <!-- Proposals Dropdown Panel -->
                    <div id="history-panel-${idx}" class="proposals-history-panel">
                        <h4 style="font-size: 0.9rem; text-transform: uppercase; color: #8e8e93; margin-bottom: 0.8rem; letter-spacing: 0.05em;">Propuestas Emitidas:</h4>
                        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                            ${client.proposals.map(p => {
                                const dateObj = new Date(p.timestamp);
                                const dateStr = dateObj.toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
                                return `
                                    <div class="proposal-item">
                                        <div class="prop-info">
                                            <span class="prop-date">${dateStr}</span>
                                            <span class="prop-services">${p.servicesList || 'Sin servicios especificados'}</span>
                                        </div>
                                        <div style="display: flex; align-items: center; gap: 1.5rem;">
                                            <span class="prop-amount">${p.total.toLocaleString('es-ES')}€</span>
                                            <div class="prop-actions">
                                                <a href="${p.link}" target="_blank" class="btn-crm-action btn-crm-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">
                                                    Ver Propuesta
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleHistory(idx) {
            const panel = document.getElementById(`history-panel-${idx}`);
            if (panel.style.display === 'block') {
                panel.style.display = 'none';
            } else {
                panel.style.display = 'block';
            }
        }

        function filterClients() {
            const query = document.getElementById('search-box').value.trim().toLowerCase();
            if (!query) {
                renderClients(allClients);
                return;
            }

            const filtered = allClients.filter(c => {
                return (c.name || '').toLowerCase().includes(query) ||
                       (c.cif || '').toLowerCase().includes(query) ||
                       (c.email || '').toLowerCase().includes(query);
            });

            renderClients(filtered);
        }

        // Fetch client lists on load
        fetchBudgetData();
    </script>
</body>
</html>
